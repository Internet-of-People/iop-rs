[package]
name = "iop-sdk"
description = "Client SDK for the IOP Stack™"

version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "iop_sdk"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = { workspace = true }
iop-coeus-proto = { workspace = true }
iop-hydra-proto = { workspace = true }
iop-hydra-sdk = { workspace = true }
iop-journal-proto = { workspace = true }
iop-keyvault = { workspace = true }
iop-morpheus-proto = { workspace = true }
iop-morpheus-sdk = { workspace = true }
iop-vault = { workspace = true }
json-digest = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
typetag = { workspace = true }

[target.'cfg(target_os="android")'.dependencies]
jni = { version = "0.21.1", default-features = false }
android_logger = "0.15.1"
